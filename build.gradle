plugins {
    id 'java'
    id 'com.diffplug.spotless' version '6.25.0' apply false
}

ext {
    junitVersion = '5.10.2'
    springBootVersion = '3.3.4'
}

allprojects {
    group = 'io.flowguard'
    version = '0.1.0-SNAPSHOT'
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'com.diffplug.spotless'

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
    }

    test {
        useJUnitPlatform()
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:${rootProject.ext.junitVersion}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    spotless {
        java {
            target 'src/**/*.java'
            googleJavaFormat('1.17.0')
        }
        format 'misc', {
            target '*.gradle', 'src/**/*.gradle', '*.md'
            trimTrailingWhitespace()
            indentWithSpaces(4)
            endWithNewline()
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                pom {
                    name = project.name
                    description = "FlowGuard module: ${project.name}"
                    url = 'https://github.com/yungsix/flowguard'
                    licenses {
                        license {
                            name = 'Apache License 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0'
                        }
                    }
                    developers {
                        developer {
                            id = 'flowguard'
                            name = 'FlowGuard Contributors'
                            url = 'https://github.com/yungsix/flowguard'
                        }
                    }
                    scm {
                        connection = 'scm:git:https://github.com/yungsix/flowguard.git'
                        developerConnection = 'scm:git:ssh://git@github.com:yungsix/flowguard.git'
                        url = 'https://github.com/yungsix/flowguard'
                    }
                }
            }
        }
    }
}
